[workspace]
members = ["crates/*", "examples/mount-standard"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
crabber = { git = "ssh://git@github.com/mattsp1290/crabber.git", rev = "6c59b01103849bde1179a6f0ea818c5a7b516820" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "fs"] }
tokio-util = "0.7"
cap-std = "4"
rustix = { version = "1", features = ["process", "fs"] }
libc = "0.2"
getrandom = "0.3"
tempfile = "3"
base64 = "0.22"

crabber-tools-core = { path = "crates/core" }
crabber-tools-fileops = { path = "crates/fileops" }
crabber-tools-search = { path = "crates/search" }
crabber-tools-shell = { path = "crates/shell" }
crabber-tools-catalog = { path = "crates/catalog" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
